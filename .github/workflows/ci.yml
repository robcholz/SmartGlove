name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +stable fmt --all --check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run library tests on host
        run: cargo +stable test --lib --target x86_64-unknown-linux-gnu

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Build firmware
        run: cargo build --target xtensa-esp32s3-none-elf

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Run clippy on firmware
        run: cargo clippy --target xtensa-esp32s3-none-elf --bin SmartGlove -- -D warnings
