name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv and pre-commit data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/uv
            .venv
          key: pre-commit-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  commit-format:
    name: Commit Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv and pre-commit data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/uv
            .venv
          key: pre-commit-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Validate commit messages with pre-commit config
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF}"
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
          else
            base_ref="${{ github.event.before }}"
          fi

          if [[ -z "${base_ref}" || "${base_ref}" == "0000000000000000000000000000000000000000" ]]; then
            commits="$(git rev-list --max-count=1 HEAD)"
          else
            commits="$(git rev-list "${base_ref}..HEAD")"
          fi

          if [[ -z "${commits}" ]]; then
            echo "No commits to validate."
            exit 0
          fi

          while IFS= read -r commit; do
            [[ -n "${commit}" ]] || continue
            msg_file="$(mktemp)"
            git log --format=%B -n 1 "${commit}" > "${msg_file}"
            echo "Checking commit ${commit}"
            uv run pre-commit run conventional-precommit-linter \
              --hook-stage commit-msg \
              --commit-msg-filename "${msg_file}"
            rm -f "${msg_file}"
          done <<< "${commits}"

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Run library tests on host
        run: cargo +stable test --lib --target x86_64-unknown-linux-gnu

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Build firmware
        run: cargo build --target xtensa-esp32s3-none-elf

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Run clippy on firmware
        run: cargo clippy --target xtensa-esp32s3-none-elf --bin smart-glove -- -D warnings
