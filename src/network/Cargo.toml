[package]
name = "network"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
identity = { path = "../identity" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
