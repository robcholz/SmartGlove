[project]
name = "smartglove"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22.3",
    "pyserial>=3.5",
]

[project.scripts]
provision-e2e = "tests.provision_e2e:main"
provision-serial = "tests.serial_capture:main"
provision-test = "tests.provision_test:main"
gesture-model = "training.postprocess:main"
gesture-infer = "training.infer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tests", "training"]

[dependency-groups]
training = [
    "esp-ppq>=0.8.0",
    "kagglehub>=0.3.12",
    "numpy>=1.26,<3",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.1",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "torch>=2.6.0",
]

[tool.uv]
package = true
