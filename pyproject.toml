[project]
name = "smartglove"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22.3",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pyserial>=3.5",
    "PyYAML>=6.0.2",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
server = "server.__main__:main"
network-e2e = "tests.network_e2e:main"
provision-e2e = "tests.provision_e2e:main"
provision-serial = "tests.serial_capture:main"
provision-test = "tests.provision_test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "tests"]

[tool.uv]
package = true
