[project]
name = "smartglove"
version = "0.1.0"
description = "SmartGlove for StarkHacks April 17-19 2026 at Purdue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22.3",
    "pyserial>=3.5",
]

[project.scripts]
provision-e2e = "tests.provision_e2e:main"
provision-serial = "tests.serial_capture:main"
provision-test = "tests.provision_test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[tool.uv]
package = true
